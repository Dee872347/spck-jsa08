<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneGame - AI Trợ Lý Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-body: #1b1d1f;
            --bg-chat: #0f121a;
            --neon-blue: #00d9ff;
            --neon-green: #00ff88;
            --neon-red: #ff0055;
            --text-color: rgba(255, 255, 255, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --user-msg-bg: #ffae00;
        }

        body {
            background: linear-gradient(135deg, #1b1d1f 0%, #2d3436 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: var(--text-color) !important;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 0 5px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--user-msg-bg) !important;
            background: rgba(0, 255, 136, 0.1);
        }

        .dropdown-menu {
            background: rgba(45, 52, 54, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .dropdown-item {
            color: var(--text-color);
            transition: 0.3s;
        }

        .dropdown-item:hover {
            background: rgba(0, 217, 255, 0.2);
            color: var(--neon-blue);
        }

        .ai-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 850px;
            height: 70vh;
            background: var(--bg-chat);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle at center, #111827 0%, #05070a 100%);
        }

        .msg {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .ai {
            background: #21262d;
            align-self: flex-start;
            border-left: 4px solid var(--neon-blue);
        }

        .user {
            background: var(--neon-red);
            align-self: flex-end;
            border-right: 4px solid #fff;
        }

        .input-area {
            padding: 20px;
            background: #05070a;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        #userInput {
            flex: 1;
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            padding: 12px 15px;
            outline: none;
        }

        #sendBtn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            border: none;
            border-radius: 12px;
            padding: 0 25px;
            font-weight: 700;
            color: #1b1d1f;
            transition: 0.3s;
        }

        #sendBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="trang_chu.html">
                <i class="bi bi-controller"></i> GameX
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="trang_chu.html"><i class="bi bi-house-door"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="bi bi-cpu"></i> AI</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-tools"></i> Tiện ích
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="tim_kiem.html"><i class="bi bi-search"></i> Tìm kiếm
                                    thông tin game</a></li>
                            <li><a class="dropdown-item" href="Cuu_hang.html"><i class="bi bi-shop"></i> Tìm kiếm cửa
                                    hàng tải game</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="https://support.google.com/?hl=vi"><i
                                        class="bi bi-question-circle"></i> Trợ giúp</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="ai-section">
        <div class="chat-wrapper">
            <div class="chat-header">
                <h2><i class="bi bi-robot"></i> Game Master AI</h2>
                <div style="color: var(--neon-green); font-size: 0.75rem;">● SERVER ONLINE</div>
            </div>
            <div id="chatBox" class="chat-box">
                <div class="msg ai">Yo! Tui là AI đây. Bạn cần hỏi gì về game hay cách phá đảo không?</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Hỏi tôi bất cứ thứ gì về game..." autocomplete="off">
                <button id="sendBtn">GỬI 🚀</button>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="load_env.js"></script>
    <script>

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled) return;

            appendMsg(text, 'user');
            userInput.value = "";
            const aiDiv = appendMsg("Đang quét dữ liệu...", 'ai');
            sendBtn.disabled = true;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        messages: [
                            { role: "system", content: "Bạn là trợ lý chuyên về Game, xưng hô thân thiện." },
                            { role: "user", content: text }
                        ]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    aiDiv.innerText = `Lỗi từ API: ${data.error?.message || "Không xác định"}`;
                } else {
                    aiDiv.innerText = data.choices[0].message.content;
                }
            } catch (err) {
                console.error(err);
                aiDiv.innerText = "Lỗi kết nối! Hãy kiểm tra Console (F12).";
            }
        }

        function appendMsg(text, type) {
            const div = document.createElement("div");
            div.className = `msg ${type}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    </script>
</body>

</html>
