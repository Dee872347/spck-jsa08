<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneGame - Đăng nhập & Đăng ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1b1d1f 0%, #2d3436 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 0;
            width: 100%;
        }

        .navbar-brand {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 8px 15px !important;
            border-radius: 8px;
        }

        .nav-link:hover {
            color: #00d9ff !important;
            background: rgba(0, 217, 255, 0.1);
        }

        .dropdown-menu {
            background: rgba(45, 52, 54, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
        }

        .dropdown-item {
            color: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 10px 15px;
            transition: all 0.3s ease;
        }

        .dropdown-item:hover {
            background: rgba(0, 217, 255, 0.2);
            color: #00d9ff;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .nav-pills-custom {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 30px;
        }

        .nav-pills-custom .nav-link-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .nav-pills-custom .nav-link-tab.active {
            background: linear-gradient(45deg, #00d9ff, #00ff88);
            color: #1b1d1f !important;
        }

        .form-label {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group-custom i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
        }

        .input-group-custom input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s ease;
        }

        .input-group-custom input:focus {
            border-color: #00d9ff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
        }

        .btn-auth-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #00d9ff, #00ff88);
            color: #1b1d1f;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn-auth-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 217, 255, 0.3);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
            padding-left: 5px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-controller"></i> GameX
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="trang_chu.html">
                            <i class="bi bi-house-door"></i> Trang chủ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="AI.html">
                            <i class="bi bi-cpu"></i> AI
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-tools"></i> Tiện ích
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="tim_kiem.html">
                                    <i class="bi bi-search"></i> Tìm kiếm thông tin game
                                </a></li>
                            <li><a class="dropdown-item" href="Cuu_hang.html">
                                    <i class="bi bi-shop"></i> Tìm kiếm cửa hàng tải game
                                </a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="https://support.google.com/?hl=vi">
                                    <i class="bi bi-question-circle"></i> Trợ giúp?
                                </a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="nav-pills-custom">
                <div id="tabLogin" class="nav-link-tab active" onclick="switchForm('login')">Đăng Nhập</div>
                <div id="tabRegister" class="nav-link-tab" onclick="switchForm('register')">Đăng Ký</div>
            </div>

            <form id="loginForm" onsubmit="return validateLogin(event)">
                <div class="mb-3">
                    <label class="form-label">Tên tài khoản</label>
                    <div class="input-group-custom">
                        <i class="bi bi-person"></i>
                        <input type="text" id="loginUser" placeholder="Nhập tên tài khoản...">
                    </div>
                    <div id="loginUserError" class="error-msg"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group-custom">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
                    </div>
                    <div id="loginPassError" class="error-msg"></div>
                </div>

                <button type="submit" class="btn-auth-submit">ĐĂNG NHẬP NGAY</button>
            </form>

            <form id="registerForm" onsubmit="return validateRegister(event)" style="display: none;">
                <div class="mb-3">
                    <label class="form-label">Tên tài khoản mới</label>
                    <div class="input-group-custom">
                        <i class="bi bi-person-plus"></i>
                        <input type="text" id="regUser" placeholder="Tối thiểu 5 ký tự...">
                    </div>
                    <div id="regUserError" class="error-msg"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <div class="input-group-custom">
                        <i class="bi bi-lock"></i>
                        <input type="password" id="regPass" placeholder="Tối thiểu 6 ký tự...">
                    </div>
                    <div id="regPassError" class="error-msg"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Xác nhận mật khẩu</label>
                    <div class="input-group-custom">
                        <i class="bi bi-lock-check"></i>
                        <input type="password" id="regConfirmPass" placeholder="Nhập lại mật khẩu...">
                    </div>
                    <div id="regConfirmPassError" class="error-msg"></div>
                </div>

                <button type="submit" class="btn-auth-submit">TẠO TÀI KHOẢN</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function switchForm(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');

            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
            }
        }

        function validateLogin(e) {
            e.preventDefault();
            let isValid = true;

            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();

            const userErr = document.getElementById('loginUserError');
            const passErr = document.getElementById('loginPassError');

            if (user === "") {
                userErr.innerText = "Bạn chưa nhập tên tài khoản kìa!";
                userErr.style.display = 'block';
                isValid = false;
            } else {
                userErr.style.display = 'none';
            }

            if (pass === "") {
                passErr.innerText = "Mật khẩu trống không thế kia sao vào?";
                passErr.style.display = 'block';
                isValid = false;
            } else {
                passErr.style.display = 'none';
            }

            if (isValid) {
                let accounts = JSON.parse(localStorage.getItem('gamex_users')) || [];

                const matchedUser = accounts.find(acc => acc.username === user);

                if (!matchedUser) {
                    userErr.innerText = "Tài khoản này chưa được đăng ký bạn ơi!";
                    userErr.style.display = 'block';
                    isValid = false;
                } else if (matchedUser.password !== pass) {
                    passErr.innerText = "Sai mật khẩu rồi, bạn nhớ lại xem nào!";
                    passErr.style.display = 'block';
                    isValid = false;
                }
            }

            if (isValid) {
                alert("Đăng nhập thành công! Đang chuyển hướng vào trang chủ...");
                window.location.href = "trang_chu.html"; 
            }
            return isValid;
        }

        function validateRegister(e) {
            e.preventDefault();
            let isValid = true;

            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const confirmPass = document.getElementById('regConfirmPass').value.trim();

            const userErr = document.getElementById('regUserError');
            const passErr = document.getElementById('regPassError');
            const confirmErr = document.getElementById('regConfirmPassError');

            if (user.length < 5) {
                userErr.innerText = "Tên tài khoản phải từ 5 ký tự trở lên nha bạn!";
                userErr.style.display = 'block';
                isValid = false;
            } else {
                userErr.style.display = 'none';
            }

            if (pass.length < 6) {
                passErr.innerText = "Mật khẩu ngắn quá, tối thiểu phải 6 ký tự!";
                passErr.style.display = 'block';
                isValid = false;
            } else {
                passErr.style.display = 'none';
            }

            if (confirmPass === "") {
                confirmErr.innerText = "Bạn phải xác nhận lại mật khẩu.";
                confirmErr.style.display = 'block';
                isValid = false;
            } else if (pass !== confirmPass) {
                confirmErr.innerText = "Hai mật khẩu không khớp nhau rồi kìa!";
                confirmErr.style.display = 'block';
                isValid = false;
            } else {
                confirmErr.style.display = 'none';
            }

            if (isValid) {
                let accounts = JSON.parse(localStorage.getItem('gamex_users')) || [];

                const isExisted = accounts.some(acc => acc.username === user);
                
                if (isExisted) {
                    userErr.innerText = "Tên tài khoản này có người dùng rồi, đổi tên khác đi!";
                    userErr.style.display = 'block';
                    isValid = false;
                } else {
                    accounts.push({ username: user, password: pass });
                    localStorage.setItem('gamex_users', JSON.stringify(accounts));
                }
            }

            if (isValid) {
                alert("Đăng ký tài khoản thành công! Dữ liệu đã lưu, giờ bạn đăng nhập thử đi.");
                switchForm('login'); 
            }
            return isValid;
        }
    </script>
</body>

</html>
